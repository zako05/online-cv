name: Test & Deploy Cloudflare Worker

on:
  pull_request:
    branches: [gh-pages]
  push:
    branches: [gh-pages]

jobs:
  test:
    name: Build Jekyll & Run Agentic Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Install Jekyll
        run: gem install "jekyll:~> 3.9.0" kramdown-parser-gfm --no-document

      - name: Build Jekyll site
        run: jekyll build

      - name: Run Agentic Readiness test suite
        run: ruby test/agentic_readiness_test.rb

  deploy-worker:
    name: Deploy Cloudflare Worker
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/gh-pages'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy Worker with Wrangler
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: '5b240bd601b2dd7711a894d07f2a84b8'
          wranglerVersion: '4.161.0'
