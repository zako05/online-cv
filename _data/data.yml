career-profile:
    title: Career Profile
    summary: |
      Over the past years, I've primarily focused on the technical aspects of testing.
      This includes gaining a comprehensive understanding of how complex software systems interact
      to design robust, scalable test automation solutions based on modern best practices.
      I thrive on collaborating with colleagues to solve technical challenges,
      constantly expanding my skills through continuous team learning.
      With an open and communicative mindset,
      my easy-going and friendly personality helps me bridge communication and align with team needs.
      I continuously strive to deliver high-quality software under demanding technical conditions.
experiences:
    - role: Software Test Engineer
      time: August 2025 - June 2026
      company: Trezor, Prague
      projects: |
        Trezor Suite (Open-source app for secure hardware wallet management)
        - Developed Playwright E2E test suites for core crypto workflows (onboarding, passphrase, analytics, etc.)
        - Resolved CI test flakiness and Electron teardown timeouts in GitHub Actions test pipelines
        - Built automated test verification for product analytics events and link integrity
      techStack: TS, Node.js, React, Playwright, Python, GitHub Actions
    - role: Software Test Engineer
      time: August 2023 - June 2025
      company: Instea, Bratislava
      projects: |
        US Quick Online 1.0 & 2.0 (B2B web-based app to manage clinical supply chain logistics)
        - Developed & maintained performance tests using K6 with JavaScript for both projects

        US Quick Dispatch Dashboard (Internal web-based app for dispatching international shipments)
          - Developed & maintained E2E/API tests using Playwright with JavaScript
          - Configured and maintained CI pipeline in Jenkins to streamline application testing
      techStack: JS, Node.js, React, GraphQL, Git (GitHub/Bitbucket), MS Playwright, Grafana Labs K6, Docker, Jenkins
    - role: Software Test Engineer
      time: Jun 2023 - Jul 2023
      company: Vectary, Bratislava
      details: |
        (Online 3D design and augmented reality platform)
        - Developed and maintained E2E/API tests using Cypress.io
        - Configured and maintained CI pipeline in Bitbucket to streamline application testing
      techStack: JS/TS, GraphQL, Git (Bitbucket), Docker, Cypress.io
    - role: Software Test Engineer
      time: Jul 2021 - Dec 2022
      company: Vestberry, Bratislava
      details: |
        (B2B SaaS for VC portfolio management, providing data insights and automated reporting)
        - Implemented an automated testing framework with Cypress.io that followed best practices
        - Developed and maintained E2E/API tests using Cypress.io
        - Configured and maintained CI pipeline in GitLab to streamline application testing
      techStack: JS/TS, Node.js, React, Postgres, GraphQL, Git (GitLab), Docker, Cypress.io, Jest
    - role: Software Test Engineer
      time: Feb 2019 - Oct 2020
      company: Innovatrics, Bratislava
      projects: |
        Fingera (B2B SaaS solution providing biometric access control and attendance management for SMBs)
        - Performed manual testing of attendance workflows, focusing on biometric fingerprint & facial recognition
        - Maintained automated test suites in Selenium WebDriver for core attendance management features
        - Architected and deployed a test automation framework using Cypress.io for the new cloud solution
      techStack: Ruby on Rails, Postgres, React, Git (Bitbucket), Docker, Selenium WebDriver, Cucumber, Capybara, Cypress.io 
    - role: Software Test Engineer - Lead
      time: Jan 2017 - Oct 2018
      company: Box+Dice, Melbourne
      details: |
        (B2B SaaS Real estate CRM for agents and agencies to manage contacts, listings, and sales)
        - Led a testing team to ensure reliable delivery of high-quality software to clients
        - Implemented Agile values and principles to integrate testing seamlessly into the development process
        - Facilitated regular team ceremonies and communication sessions (e.g. stand-ups, retrospectives)
        - Executed structured test plans to maintain high application stability across production releases
      techStack: PHP, Ruby on Rails, Backbone.js, CoffeeScript, React Native, MariaDB, Postgres, Git (GitHub), Jenkins, Jasmine, Selenium WebDriver, Appium
