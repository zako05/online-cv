<head>
  <title>{% if page.title %}{{ page.title }}{% else %}{{ site.title }} | {{ site.data.data.sidebar.tagline }}{% endif %}</title>

  <!-- Meta -->
  <meta charset="utf-8">
  {% if site.chrome_mobile_color %}
  <meta name="theme-color" content="{{ site.chrome_mobile_color }}">
  {% endif%}
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  {% assign skill_names = site.data.data.skills.toolset | map: "name" %}
  <meta name="description" content="{{ page.description | default: site.description | default: 'A beautiful Jekyll theme for creating resume' | strip_newlines }}">
  <meta name="keywords" content="{{ site.data.data.sidebar.tagline }}, {{ skill_names | join: ', ' }}, {{ site.data.data.sidebar.name }}">
  <meta name="author" content="{{ site.data.data.sidebar.name }}">
  <meta name="application-name" content="{{ site.title }} Online CV">
  <meta name="robots" content="{{ page.robots | default: 'index, follow' }}">

  <!-- Canonical & OpenGraph -->
  <link rel="canonical" href="{{ site.url }}{{ site.baseurl }}{{ page.url | replace: 'index.html', '' }}">
  <meta property="og:site_name" content="{{ site.title }} Online CV">
  <meta property="og:title" content="{% if page.title %}{{ page.title }}{% else %}{{ site.title }} | {{ site.data.data.sidebar.tagline }}{% endif %}">
  <meta property="og:description" content="{{ page.description | default: site.description | strip_newlines }}">
  <meta property="og:type" content="profile">
  <meta property="og:url" content="{{ site.url }}{{ site.baseurl }}{{ page.url | replace: 'index.html', '' }}">

  <!-- Agent & Developer Resource Discovery -->
  <link rel="alternate" type="text/markdown" href="{{ site.url }}{{ site.baseurl }}{{ page.markdown_url | default: '/index.md' }}" title="Markdown version">
  <link rel="alternate" type="text/plain" href="{{ site.url }}{{ site.baseurl }}/llms.txt" title="LLMs.txt">
  <link rel="alternate" type="application/json" href="{{ site.url }}{{ site.baseurl }}/api/cv.json" title="Michal Zak Online CV API (JSON)">
  <link rel="help" href="{{ site.url }}{{ site.baseurl }}/docs/" title="Michal Zak Online CV API Documentation">
  <link rel="sitemap" type="application/xml" href="{{ site.url }}{{ site.baseurl }}/sitemap.xml" title="Sitemap">
  {% if site.data.data.sidebar.github %}
  <link rel="me" href="https://github.com/{{ site.data.data.sidebar.github }}">
  {% endif %}

  <!-- Favicon -->
  <link rel="shortcut icon" href="{{ site.baseurl }}/favicon4.ico">

  <!-- Global CSS -->
  <link rel="stylesheet" href="{{ site.baseurl }}/assets/plugins/bootstrap/css/bootstrap.min.css">

  <!-- Plugins CSS -->
  <link rel="stylesheet" href="{{ site.baseurl }}/assets/plugins/font-awesome/css/all.css">

  <!-- Theme CSS -->
  <link id="theme-style" rel="stylesheet" href="{{ site.baseurl }}/assets/css/main.css">
  <!-- HTML5 shim and Respond.js for IE8 support of HTML5 elements and media queries -->
  <!--[if lt IE 9]>
      <script src="https://oss.maxcdn.com/html5shiv/3.7.2/html5shiv.min.js"></script>
      <script src="https://oss.maxcdn.com/respond/1.4.2/respond.min.js"></script>
    <![endif]-->

  <!-- Structured Data (Schema.org JSON-LD) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "ProfilePage",
        "@id": "{{ site.url }}{{ site.baseurl }}/#profilepage",
        "url": "{{ site.url }}{{ site.baseurl }}/",
        "name": "{{ site.data.data.sidebar.name }} | {{ site.data.data.sidebar.tagline }}",
        "description": "{{ site.description | strip_newlines }}",
        "keywords": [
          {{ site.data.data.sidebar.tagline | jsonify }}{% for skill in site.data.data.skills.toolset %},
          {{ skill.name | jsonify }}{% endfor %}
        ],
        "mainEntity": {
          "@id": "{{ site.url }}{{ site.baseurl }}/#person"
        }
      },
      {
        "@type": "Person",
        "@id": "{{ site.url }}{{ site.baseurl }}/#person",
        "name": "{{ site.data.data.sidebar.name }}",
        "jobTitle": "{{ site.data.data.sidebar.tagline }}",
        "description": "{{ site.description | strip_newlines }}",
        "url": "{{ site.url }}{{ site.baseurl }}/",
        "email": "mailto:{{ site.data.data.sidebar.email }}",
        "telephone": "{{ site.data.data.sidebar.phone }}",
        "knowsAbout": [
          {{ site.data.data.sidebar.tagline | jsonify }}{% for skill in site.data.data.skills.toolset %},
          {{ skill.name | jsonify }}{% endfor %}
        ],
        "sameAs": [
          "https://github.com/{{ site.data.data.sidebar.github }}",
          "https://linkedin.com/in/{{ site.data.data.sidebar.linkedin }}",
          "https://twitter.com/{{ site.data.data.sidebar.twitter }}",
          "https://stackoverflow.com/users/{{ site.data.data.sidebar.stack-overflow }}",
          "https://www.hackerrank.com/{{ site.data.data.sidebar.hacker-rank }}"
        ]
      },
      {
        "@type": "ProfessionalService",
        "@id": "{{ site.url }}{{ site.baseurl }}/#service",
        "name": "{{ site.data.data.sidebar.name }} - {{ site.data.data.sidebar.tagline }}",
        "url": "{{ site.url }}{{ site.baseurl }}/",
        "description": "{{ site.description | strip_newlines }}",
        "serviceType": {{ site.data.data.sidebar.tagline | jsonify }},
        "keywords": "{{ site.data.data.sidebar.tagline }}, {{ skill_names | join: ', ' }}",
        "knowsAbout": [
          {{ site.data.data.sidebar.tagline | jsonify }}{% for skill in site.data.data.skills.toolset %},
          {{ skill.name | jsonify }}{% endfor %}
        ],
        "provider": {
          "@id": "{{ site.url }}{{ site.baseurl }}/#person"
        },
        "offers": [
          {% for skill in site.data.data.skills.toolset limit: 4 %}{
            "@type": "Offer",
            "name": {{ skill.name | jsonify }}
          }{% unless forloop.last %},{% endunless %}
          {% endfor %}
        ]
      }
    ]
  }
  </script>
</head>
